name: Publish npm packages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspaces

      - name: Test packages
        run: npm test --workspaces --if-present

      - name: Check package versions match tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const packagesDir = path.join(process.cwd(), 'packages');

          const packages = fs.readdirSync(packagesDir)
            .map(name => path.join(packagesDir, name, 'package.json'))
            .filter(file => fs.existsSync(file));

          let failed = false;

          for (const file of packages) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));

            if (pkg.private) {
              continue;
            }

            if (pkg.version !== tagVersion) {
              console.error(`${pkg.name}: package.json version ${pkg.version} != tag ${tagVersion}`);
              failed = true;
            } else {
              console.log(`${pkg.name}: ${pkg.version}`);
            }
          }

          if (failed) {
            process.exit(1);
          }
          NODE

      - name: Publish packages to npm
        run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
